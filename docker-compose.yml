version: '3.8'

services:
  backend:
    build: .
    container_name: agriguard-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_PORT=8000
      - DEFAULT_DEVICE=cpu
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
