sources:
  - id: "paddy_rice_disease_uci"
    name: "Rice Leaf Diseases Dataset"
    authors: "Prajapati, H. B., Dabhi, V. K., Prajapati, S. V."
    citation: "A robust algorithm for detection and classification of rice leaf diseases, Computers and Electronics in Agriculture, 2017"
    source_url: "https://archive.ics.uci.edu/dataset/547/rice+leaf+diseases"
    mirrors:
      - "https://raw.githubusercontent.com/pjreddie/darknet/master"  # sample or open mirrors
      - "https://github.com/spMohanty/PlantVillage-Dataset"
    license: "CC BY 4.0 / Open Research Access"
    access_method: "Direct HTTPS / Zip Download / Open Mirror"
    category: "grain_crop_leaf"
    crop: "rice_leaf"
    classes:
      - "bacterial_leaf_blight"
      - "brown_spot"
      - "leaf_smut"
      - "healthy"
    known_limitations: "Lab-acquired leaf segments with white/plain background on some subsets; field variability requires data augmentation."

  - id: "plantvillage_open_subset"
    name: "PlantVillage Open Research Dataset"
    authors: "Hughes, D. P., & Salathé, M. (Penn State University)"
    citation: "An open access repository of images on plant health to enable the development of mobile disease diagnostics, arXiv:1511.08060, 2015"
    source_url: "https://github.com/spMohanty/PlantVillage-Dataset"
    license: "CC BY 4.0 (Open Access, Creative Commons Attribution)"
    access_method: "Git Archive / Open GitHub Release / HTTPS"
    category_coverage:
      - "fruit_leaf"
      - "vegetable_leaf"
      - "grain_crop_leaf"
    crops:
      - "apple_leaf"
      - "grape_leaf"
      - "tomato_leaf"
      - "potato_leaf"
      - "maize_leaf"
    known_limitations: "Captured in controlled studio conditions; cross-domain field evaluation recommended."

  - id: "paddy_doctor_iclr"
    name: "Paddy Doctor: A Large-Scale Benchmark for Paddy Disease Recognition"
    authors: "P. B. Kumar et al."
    citation: "Paddy Doctor Benchmark, CV4A Workshop, ICLR 2023"
    source_url: "https://paddydoctor.github.io/"
    license: "Research & Non-Commercial Evaluation License"
    access_method: "Direct Kaggle API / Official Site"
    category: "grain_crop_leaf"
    crop: "rice_leaf"
    status: "referenced"
    known_limitations: "Full benchmark is 2+ GB, suitable for high-compute scaleout."
